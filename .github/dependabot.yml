version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "deps"
      include: scope
    # The root module doesn't use OpenTelemetry, but go.work makes this
    # entry see otelmonobank's requirements too and open duplicates of
    # the /otelmonobank PRs below.
    ignore:
      - dependency-name: "go.opentelemetry.io/*"

  - package-ecosystem: gomod
    directory: "/otelmonobank"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
      - otelmonobank
    commit-message:
      prefix: "deps(otelmonobank)"
      include: scope
    groups:
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
